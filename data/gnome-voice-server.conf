# gnome-voice-server configuration
#
# Command-line options override anything set here.

[server]
# Listen address; leave unset for all interfaces.
#address=127.0.0.1

port=8085

# Where voicegrams (.ogg + .voice) are kept.
#storage-dir=/var/lib/gnome-voice-server

# Base URL that clients use to reach this server. It is written into the
# <stream> element of every voicegram. Set this when running behind a
# reverse proxy that terminates TLS.
#public-url=https://voice.example.org

# File containing a bearer token. When set, uploads need
#   Authorization: Bearer <token>
# Deletion is only possible when a token is configured.
#token-file=/etc/gnome-voice-server/token

# Largest accepted voicegram, in bytes (default 32 MiB).
#max-size=33554432

#max-clients=32

# Serve the archive but accept no uploads.
#read-only=false
